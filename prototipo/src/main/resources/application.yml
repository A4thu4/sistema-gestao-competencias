spring:
  application:
    name: sgc
  datasource:
    url: jdbc:postgresql://localhost:5432/sgc
    username: sgc
    password: sgc
  jpa:
    # O esquema é criado só pelas migrações Flyway; o JPA apenas confere.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # Cada pacote tem sua faixa de versões (V1_x identidade … V6_x privacidade).
    # out-of-order permite aplicar uma V2_2 criada depois de uma V4_1 já aplicada.
    out-of-order: true
  thymeleaf:
    cache: false

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        # DA-07: HttpOnly e SameSite. O Secure é ligado em produção, atrás do proxy com HTTPS.
        http-only: true
        same-site: lax

sgc:
  # Carrega a empresa de exemplo (pessoas, competências, ciclos e respostas) quando o banco está vazio.
  demo:
    carregar: true
  # Chave do HMAC que liga uma avaliação enviada à designação só para a reabertura (UC-09, DA-06).
  # Em produção vem de variável de ambiente.
  chave-verificador: ${SGC_CHAVE_VERIFICADOR:troque-esta-chave-em-producao}
  # Endereço usado nos links dos e-mails (convites e link do avaliador externo).
  url-base: ${SGC_URL_BASE:http://localhost:8080}

logging:
  level:
    br.edu.pucgoias.sgc: INFO
