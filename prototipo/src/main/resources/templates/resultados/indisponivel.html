<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: menu('resultados')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topo('Resultados')}"></header>
        <main class="app-content">
            <div class="cartao text-center py-5">
                <i class="bi bi-hourglass-split display-5 text-secondary"></i>
                <h1 class="h4 mt-3" th:text="${titulo}">Resultado ainda não liberado</h1>
                <p class="text-secondary" th:text="${mensagem}">Mensagem</p>
                <a th:href="@{/resultados}" class="btn btn-outline-secondary">Voltar aos resultados</a>
            </div>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
