<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Avaliação externa')}"></head>
<body>
<link rel="stylesheet" th:href="@{/css/avaliacoes.css}">
<!-- UC-03, extensão 1a (RF-34): avaliador externo, sem login e sem menu. -->
<header th:replace="~{avaliacoes/externo-indisponivel :: topoExterno}"></header>
<main class="externo-conteudo">
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <h1 class="titulo-pagina">Avaliação de <span th:text="${f.avaliado.nome}">Nome</span></h1>
    <p class="subtitulo-pagina">
        Você foi convidado para o <span th:text="${f.designacao.cicloNome}">ciclo</span>. Responda até
        <strong th:text="${f.encerramentoTexto()}">data</strong>. Leva poucos minutos e você pode parar e voltar pelo
        mesmo link.
    </p>
    <div th:replace="~{avaliacoes/questionario :: formulario}"></div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/responder-avaliacao.js}"></script>
</body>
</html>
