<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo} ?: 'Avaliação externa')}"></head>
<body>
<link rel="stylesheet" th:href="@{/css/avaliacoes.css}">
<!-- UC-03, 1a.3: link inválido, avaliação já enviada ou ciclo encerrado. Não mostra o questionário. -->
<header th:fragment="topoExterno" class="externo-topo">
    <span class="app-marca-icone"><i class="bi bi-stack"></i></span>
    <span><strong>Competências</strong><small>AVALIAÇÃO EXTERNA</small></span>
</header>
<main class="externo-conteudo">
    <div class="cartao text-center py-5 mt-4">
        <i class="bi display-5" th:classappend="${jaEnviada} ? 'bi-check-circle text-success' : 'bi-exclamation-circle text-secondary'"></i>
        <h1 class="h4 mt-3" th:text="${titulo}">Título</h1>
        <p class="text-secondary mb-0" th:text="${mensagem}">Mensagem</p>
    </div>
</main>
</body>
</html>
