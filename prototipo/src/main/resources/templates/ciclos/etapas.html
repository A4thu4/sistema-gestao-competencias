<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Etapas da montagem do ciclo (UC-02). ciclo = CicloResumo (ou null no ciclo novo); atual = 1 a 4. -->
<ol th:fragment="etapas(ciclo, atual)" class="etapas" aria-label="Etapas do ciclo">
    <li th:classappend="${atual == 1} ? 'atual'">
        <a th:href="${ciclo == null} ? @{/ciclos/novo} : @{/ciclos/{id}/dados(id=${ciclo.id})}">
            <span class="numero">1</span> Dados do ciclo</a>
    </li>
    <li th:classappend="${(atual == 2 ? 'atual ' : '') + (ciclo == null ? 'desligada' : '')}">
        <span th:if="${ciclo == null}"><span class="numero">2</span> Avaliados e questionários</span>
        <a th:unless="${ciclo == null}" th:href="@{/ciclos/{id}/avaliados(id=${ciclo.id})}">
            <span class="numero">2</span> Avaliados e questionários</a>
    </li>
    <li th:classappend="${(atual == 3 ? 'atual ' : '') + (ciclo == null ? 'desligada' : '')}">
        <span th:if="${ciclo == null}"><span class="numero">3</span> Avaliadores</span>
        <a th:unless="${ciclo == null}" th:href="@{/ciclos/{id}/avaliadores(id=${ciclo.id})}">
            <span class="numero">3</span> Avaliadores</a>
    </li>
    <li th:classappend="${(atual == 4 ? 'atual ' : '') + (ciclo == null ? 'desligada' : '')}">
        <span th:if="${ciclo == null}"><span class="numero">4</span> Resumo e agendamento</span>
        <a th:unless="${ciclo == null}" th:href="@{/ciclos/{id}(id=${ciclo.id})}">
            <span class="numero">4</span> Resumo e agendamento</a>
    </li>
</ol>

<!-- Cabeçalho comum: voltar, título com a situação do ciclo. -->
<div th:fragment="cabecalho(ciclo, titulo, subtitulo)">
    <a class="small text-decoration-none" th:href="@{/ciclos}"><i class="bi bi-arrow-left"></i> Voltar para ciclos de avaliação</a>
    <div class="d-flex flex-wrap align-items-start gap-2 mt-2">
        <h1 class="titulo-pagina me-auto" th:text="${titulo}">Título</h1>
        <span th:if="${ciclo != null}" class="selo" th:classappend="'selo-' + ${#strings.toLowerCase(ciclo.situacao)}"
              th:text="${ciclo.situacaoRotulo()}">Rascunho</span>
        <span th:if="${ciclo == null}" class="selo selo-rascunho">Rascunho</span>
    </div>
    <p class="subtitulo-pagina" th:text="${subtitulo}">Subtítulo</p>
</div>
</body>
</html>
