<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log de auditoria')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: menu('auditoria')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topo('Log de auditoria')}"></header>
        <main class="app-content">
            <h1 class="titulo-pagina">Log de auditoria</h1>
            <p class="subtitulo-pagina">Acessos a resultados, liberações, exportações, reaberturas e moderações.</p>
            <div class="cartao p-0">
                <div class="table-responsive">
                    <table class="table table-sm align-middle mb-0">
                        <thead><tr><th>Data e hora</th><th>Usuário</th><th>Ação</th><th>Detalhe</th><th>Motivo</th></tr></thead>
                        <tbody>
                        <tr th:each="r : ${registros.content}">
                            <td class="text-nowrap" th:text="${#temporals.format(r.ocorridoEmBrasilia, 'dd/MM/yyyy HH:mm')}">data</td>
                            <td th:text="${r.usuario}">usuário</td>
                            <td class="text-nowrap" th:text="${@rotulos.acao(r.acao)}">ação</td>
                            <td th:text="${r.detalhe}">detalhe</td>
                            <td th:text="${r.motivo} ?: '—'">motivo</td>
                        </tr>
                        <tr th:if="${registros.empty}"><td colspan="5" class="text-secondary p-3">Nenhum registro ainda.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <nav class="mt-3 d-flex gap-2" th:if="${registros.totalPages > 1}">
                <a class="btn btn-sm btn-outline-secondary" th:if="${registros.hasPrevious()}" th:href="@{/auditoria(pagina=${registros.number - 1})}">Anterior</a>
                <a class="btn btn-sm btn-outline-secondary" th:if="${registros.hasNext()}" th:href="@{/auditoria(pagina=${registros.number + 1})}">Próxima</a>
            </nav>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
