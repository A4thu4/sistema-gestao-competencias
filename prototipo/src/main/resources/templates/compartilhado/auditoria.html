<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log de auditoria')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: menu('auditoria')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topo('Log de auditoria')}"></header>
        <main class="app-content">
            <h1 class="titulo-pagina">Log de auditoria</h1>
            <p class="subtitulo-pagina">Acessos a resultados, liberações, exportações, reaberturas e moderações.</p>
            <form class="row g-2 align-items-end mb-3" method="get" th:action="@{/auditoria}">
                <div class="col-12 col-md-3">
                    <label class="form-label small mb-1" for="usuario">Usuário</label>
                    <input class="form-control form-control-sm" id="usuario" name="usuario" th:value="${filtro.usuario}">
                </div>
                <div class="col-12 col-md-3">
                    <label class="form-label small mb-1" for="acao">Ação</label>
                    <select class="form-select form-select-sm" id="acao" name="acao">
                        <option value="">Todas</option>
                        <option th:each="a : ${acoes}" th:value="${a}" th:text="${@rotulos.acao(a)}"
                                th:selected="${a == filtro.acao}">Ação</option>
                    </select>
                </div>
                <div class="col-6 col-md-2">
                    <label class="form-label small mb-1" for="de">De</label>
                    <input class="form-control form-control-sm" type="date" id="de" name="de" th:value="${filtro.de}">
                </div>
                <div class="col-6 col-md-2">
                    <label class="form-label small mb-1" for="ate">Até</label>
                    <input class="form-control form-control-sm" type="date" id="ate" name="ate" th:value="${filtro.ate}">
                </div>
                <div class="col-12 col-md-2 d-flex gap-2">
                    <button class="btn btn-sm btn-primary" type="submit">Filtrar</button>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/auditoria}" th:unless="${filtro.vazio()}">Limpar</a>
                </div>
            </form>
            <div class="cartao p-0">
                <div class="table-responsive">
                    <table class="table table-sm align-middle mb-0">
                        <thead><tr><th>Data e hora</th><th>Usuário</th><th>Ação</th><th>Detalhe</th><th>Motivo</th></tr></thead>
                        <tbody>
                        <tr th:each="r : ${registros.content}">
                            <td class="text-nowrap" th:text="${#temporals.format(r.ocorridoEmBrasilia, 'dd/MM/yyyy HH:mm')}">data</td>
                            <td th:text="${r.usuario}">usuário</td>
                            <td class="text-nowrap" th:text="${@rotulos.acao(r.acao)}">ação</td>
                            <td th:text="${r.detalhe}">detalhe</td>
                            <td th:text="${r.motivo} ?: '—'">motivo</td>
                        </tr>
                        <tr th:if="${registros.empty}"><td colspan="5" class="text-secondary p-3"
                                th:text="${filtro.vazio()} ? 'Nenhum registro ainda.' : 'Nenhum registro com esses filtros.'">Nenhum registro.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <nav class="mt-3 d-flex align-items-center gap-2" th:if="${registros.totalPages > 1}">
                <a class="btn btn-sm btn-outline-secondary" th:if="${registros.hasPrevious()}"
                   th:href="@{/auditoria(pagina=${registros.number - 1},usuario=${filtro.usuario},acao=${filtro.acao},de=${filtro.de},ate=${filtro.ate})}">Anterior</a>
                <span class="small text-secondary" th:text="'Página ' + ${registros.number + 1} + ' de ' + ${registros.totalPages}">Página 1 de 2</span>
                <a class="btn btn-sm btn-outline-secondary" th:if="${registros.hasNext()}"
                   th:href="@{/auditoria(pagina=${registros.number + 1},usuario=${filtro.usuario},acao=${filtro.acao},de=${filtro.de},ate=${filtro.ate})}">Próxima</a>
            </nav>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
