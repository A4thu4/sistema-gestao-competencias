<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('E-mails enviados')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: menu('emails')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topo('E-mails enviados')}"></header>
        <main class="app-content">
            <h1 class="titulo-pagina">E-mails enviados</h1>
            <p class="subtitulo-pagina">Caixa de saída. Nesta versão nenhum e-mail sai do sistema.</p>
            <div class="cartao p-0">
                <div class="table-responsive">
                    <table class="table table-sm align-middle mb-0">
                        <thead><tr><th>Data e hora</th><th>Para</th><th>Tipo</th><th>Assunto e mensagem</th></tr></thead>
                        <tbody>
                        <tr th:each="e : ${emails.content}">
                            <td class="text-nowrap" th:text="${#temporals.format(e.criadoEmBrasilia, 'dd/MM/yyyy HH:mm')}">data</td>
                            <td th:text="${e.para}">para</td>
                            <td><span class="selo selo-rascunho" th:text="${@rotulos.tipoEmail(e.tipo)}">tipo</span></td>
                            <td><strong th:text="${e.assunto}">assunto</strong>
                                <div class="small text-secondary" style="white-space: pre-line" th:text="${e.corpo}">corpo</div></td>
                        </tr>
                        <tr th:if="${emails.empty}"><td colspan="4" class="text-secondary p-3">Nenhum e-mail ainda.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <nav class="mt-3 d-flex gap-2" th:if="${emails.totalPages > 1}">
                <a class="btn btn-sm btn-outline-secondary" th:if="${emails.hasPrevious()}" th:href="@{/emails(pagina=${emails.number - 1})}">Anterior</a>
                <a class="btn btn-sm btn-outline-secondary" th:if="${emails.hasNext()}" th:href="@{/emails(pagina=${emails.number + 1})}">Próxima</a>
            </nav>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
