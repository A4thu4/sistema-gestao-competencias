<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<!-- Página dos erros tratados pelo Spring Boot (por exemplo, 403 barrado pelo filtro de segurança e 404). -->
<head th:replace="~{fragments/layout :: head('Erro')}"></head>
<body>
<main class="container py-5" style="max-width: 640px">
    <div class="cartao text-center py-5">
        <i class="bi bi-exclamation-circle display-5 text-secondary"></i>
        <th:block th:switch="${status}">
            <h1 class="h4 mt-3" th:case="403">Acesso não permitido</h1>
            <h1 class="h4 mt-3" th:case="404">Página não encontrada</h1>
            <h1 class="h4 mt-3" th:case="*">Algo deu errado</h1>
        </th:block>
        <p class="text-secondary" th:if="${status == 403}">Você não tem permissão para ver esta página ou estes dados.</p>
        <p class="text-secondary" th:if="${status == 404}">O endereço não existe ou foi removido.</p>
        <p class="text-secondary" th:if="${status != 403 and status != 404}">Tente de novo em instantes. Se continuar, avise o RH.</p>
        <a th:href="@{/}" class="btn btn-outline-secondary">Voltar à página inicial</a>
    </div>
</main>
</body>
</html>
